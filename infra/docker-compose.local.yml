services:
  mongo:
    image: mongo:7.0
    container_name: hermes-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mongo-data:/data/db

  mongo-init:
    image: mongo:7.0
    container_name: hermes-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./mongo/init-replica-set.js:/docker-entrypoint-initdb.d/init-replica-set.js:ro
    entrypoint: ["bash", "-lc", "mongosh --host mongo:27017 /docker-entrypoint-initdb.d/init-replica-set.js"]
    restart: "no"

  redis:
    image: redis:7.2-alpine
    container_name: hermes-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: hermes-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hermes_minio
      MINIO_ROOT_PASSWORD: hermes_minio_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  minio-mc:
    image: minio/mc:latest
    container_name: hermes-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hermes_minio hermes_minio_secret;
      mc mb --ignore-existing local/hermes-health;
      mc mb --ignore-existing local/hermes-documents;
      mc mb --ignore-existing local/hermes-uploads;
      exit 0;
      "
    restart: "no"

volumes:
  mongo-data:
  redis-data:
  minio-data:
